<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Purdue automatic sign-in</title>
<style>
  body { min-width: 19rem; margin: 1rem; font: 14px/1.5 system-ui, sans-serif; }
  button, select { font: inherit; }
  button { display: block; width: 100%; margin: .5rem 0; padding: .45rem; }
  select { display: block; width: 100%; margin: .35rem 0; padding: .35rem; }
  [hidden] { display: none !important; }
  #status { min-height: 1.5em; }
  #manual-question { border: 1px solid #bbb; padding: .6rem; margin: .7rem 0; }
</style>
<strong>Purdue automatic sign-in</strong>
<p id="mode-state" role="status" aria-live="polite"></p>
<button id="automatic">Regular automatic sign-in</button>
<button id="switch">Switch accounts</button>
<label for="manual-length">Complete manual for</label>
<select id="manual-length">
  <option value="15">15 minutes</option>
  <option value="30">30 minutes</option>
  <option value="60">1 hour</option>
  <option value="until-resumed">Until I resume</option>
</select>
<button id="manual">Start complete manual</button>
<div id="manual-question" hidden role="group" aria-label="Sign out now?">
  <strong>Sign out now?</strong>
  <p>Complete manual is on. Sign out if you want to choose a different account.</p>
  <button id="manual-signout">Yes, sign out</button>
  <button id="manual-stay">No, stay signed in</button>
</div>
<hr>
<button id="signout">Sign out</button>
<button id="settings">Settings</button>
<button id="retry">Retry on this tab</button>
<p id="status" role="status" aria-live="polite"></p>
<script src="popup.js"></script>
</html>
